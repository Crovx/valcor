<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="valcorGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0056D2"/>
      <stop offset="100%" stop-color="#00358A"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#valcorGrad)"/>
  
  <!-- Faceted Geometric V / Polyline Structure -->
  <line x1="18" y1="20" x2="32" y2="44" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="46" y1="20" x2="32" y2="44" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="18" y1="20" x2="32" y2="28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="46" y1="20" x2="32" y2="28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="28" x2="32" y2="44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Polyline Node Circles -->
  <circle cx="18" cy="20" r="3.5" fill="#FFFFFF"/>
  <circle cx="46" cy="20" r="3.5" fill="#FFFFFF"/>
  <circle cx="32" cy="28" r="2.5" fill="#FFFFFF"/>
  <circle cx="32" cy="44" r="4" fill="#FFFFFF"/>
</svg>
